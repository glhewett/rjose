[package]
name = "rjose"
version = "0.0.1"
authors = ["Greg Hewett <glh@strand3.com>"]
license-file = "LICENSE"
keywords = ["json", "jose"]
readme = "README.md"
edition = "2021"

[dependencies]
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
rsa = "0.9.6"
serde = { version ="1", features = ["derive"] }
serde_derive = "1"
serde_json = "1"
